name: Catalog CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      strict_security:
        description: Enforce security targets (legacy education instance fails)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      portable: ${{ steps.plan.outputs.portable }}
      sage: ${{ steps.plan.outputs.sage }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Discover all 19 routes and delivered test suites
        id: plan
        run: python ci/run.py plan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog-plan
          path: ci-results/plan.json
          if-no-files-found: error

  portable:
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.portable) }}
    name: portable / ${{ matrix.id }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install research test dependencies
        run: python -m pip install -e ".[hybrid]" cryptography==50.0.2 pytest==9.1.1
      - name: Run selected suite
        run: python ci/run.py run "${{ matrix.id }}"
      - name: Publish actual counts and scope
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog-${{ matrix.id }}
          path: ci-results/*
          if-no-files-found: error

  sage:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.sage) }}
    name: sage / ${{ matrix.id }}
    # Official Sage 10.9 Linux amd64 image; fixed digest for reproducibility.
    container:
      image: sagemath/sagemath@sha256:2401ffa8e9fc85c7ea17d3649bde5958b4dbf0858b3e504098c4102720151711
      options: --user root
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install research test dependencies in Sage
        run: sage -python -m pip install -e ".[hybrid]" cryptography==50.0.2 pytest==9.1.1
      - name: Build pinned ML-DSA engines for their independent IBS suite
        if: ${{ matrix.id == 'cert-ml-dsa' }}
        run: sage -python -m ibme.ibs.certified.native.build
      - name: Build pinned Falcon engines and author selftest
        if: ${{ matrix.id == 'cert-falcon' }}
        run: sage -python -m ibme.ibs.certified.falcon_native.build --selftest
      - name: Install Wang-PW native build dependencies
        if: ${{ matrix.id == 'wang-pw' }}
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git g++ libmpfr-dev libgmp-dev libssl-dev
      - name: Build Wang-PW target native sampler
        if: ${{ matrix.id == 'wang-pw' }}
        run: |
          sage -python - <<'PY'
          import os
          from pathlib import Path

          from ibme.ibs.wang_pw_target.native import build_native

          path = build_native().resolve()
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              stream.write(f"IBME_WANG_PW_TARGET_NATIVE={path}\n")
          PY
      - name: Run actual Sage suite
        run: sage -python ci/run.py run "${{ matrix.id }}"
      - name: Publish actual counts and scope
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog-${{ matrix.id }}
          path: ci-results/*
          if-no-files-found: error

  coverage:
    if: always()
    needs: [plan, portable, sage]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: catalog-*
          path: ci-results
          merge-multiple: true
      - name: Report every route; reject missing or failing scheduled receipts
        run: python ci/run.py summary

  strict-security:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.strict_security }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: mkdir -p ci-results
      - run: python -m pip install -e . pytest==9.1.1
      - name: Enforce known education-profile security targets
        run: python -m pytest -p no:cacheprovider --runxfail -ra --tb=short tests/test_known_security_gaps.py --junitxml=ci-results/strict.xml
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: strict-security
          path: ci-results/*.xml
          if-no-files-found: error
